[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-search-download"
version = "0.1.0"
description = "Search scholarly sources, verify paper metadata, and collect checked PDFs from official publishers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{name = "LiX-Works"}]
dependencies = ["requests>=2.31,<3", "pypdf>=6,<7"]

[project.optional-dependencies]
browser = ["cloakbrowser>=0.4.10,<0.5"]

[project.scripts]
literature-workflow = "literature_workflow.cli:main"

[project.urls]
Repository = "https://github.com/LiX-Works/literature-search-download"

[tool.setuptools.packages.find]
where = ["src"]
