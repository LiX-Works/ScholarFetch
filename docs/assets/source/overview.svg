<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="590" viewBox="0 0 1600 590" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">ScholarFetch overview</title>
<desc id="d">(a) Candidates from six databases, with metadata checked. (b) Each PDF is downloaded from the publisher in a dedicated browser using your own institutional access, then identity-checked. (c) Outputs: verified PDFs, RIS or BibTeX records, a follow-up list; you decide what to cite.</desc>
